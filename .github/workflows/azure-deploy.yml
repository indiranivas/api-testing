name: Deploy to Azure Windows Host

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js 24
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm install
      shell: pwsh

    - name: Verify Node version
      run: node --version
      shell: pwsh

    - name: Check npm version
      run: npm --version
      shell: pwsh

    - name: Build application
      run: npm run build --if-present
      shell: pwsh

    - name: Run tests
      run: npm test --if-present
      shell: pwsh
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        PORT: 8000
        NODE_ENV: test

  deploy-azure:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js 24
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install
      shell: pwsh

    - name: Create environment file for Azure
      run: |
        $env:DATABASE_URL = "${{ secrets.DATABASE_URL }}"
        $env:BEARER_TOKEN = "${{ secrets.BEARER_TOKEN }}"
        $env:PORT = "8000"
        $env:NODE_ENV = "production"

        # Create .env for deployment
        @"
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        BEARER_TOKEN=${{ secrets.BEARER_TOKEN }}
        PORT=8000
        NODE_ENV=production
        "@ | Out-File -FilePath .env -Encoding UTF8
      shell: pwsh

    - name: Test server startup
      run: |
        $job = Start-Job -ScriptBlock {
          node server.js
        }
        Start-Sleep -Seconds 5
        Stop-Job -Job $job
      shell: pwsh
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        PORT: 8000

    - name: Deploy to Azure
      run: |
        Write-Host "Deploying to Azure Windows Host"
        Write-Host "Node version: $(node --version)"
        Write-Host "NPM version: $(npm --version)"
        Write-Host "Environment: Production"
        Write-Host "Database: PostgreSQL"
        Write-Host "API: Unified Telemetry v2.0"
      shell: pwsh

    - name: Generate deployment info
      run: |
        $deploymentInfo = @{
          "timestamp" = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "node_version" = (node --version)
          "npm_version" = (npm --version)
          "platform" = "Windows"
          "api_version" = "2.0.0"
          "status" = "deployed"
        }

        $deploymentInfo | ConvertTo-Json | Out-File -FilePath deployment-info.json -Encoding UTF8

        Write-Host "Deployment Info:"
        Get-Content deployment-info.json
      shell: pwsh

    - name: Verify deployment
      run: |
        Write-Host "✅ Deployment to Azure Complete"
        Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        Write-Host "API: Unified Telemetry v2.0"
        Write-Host "Host: Azure Windows"
        Write-Host "Node: 24"
        Write-Host "Port: 8000"
        Write-Host "Status: Ready"
        Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      shell: pwsh

  windows-health-check:
    runs-on: windows-latest
    if: always()

    steps:
    - name: System Information
      run: |
        Write-Host "Windows Build Info:"
        [System.Environment]::OSVersion.VersionString

        Write-Host "`nNode.js Info:"
        node --version
        npm --version

        Write-Host "`nPlatform Info:"
        [System.Environment]::ProcessorCount
      shell: pwsh
